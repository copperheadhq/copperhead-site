# GitHub only keeps repository traffic (views, clones, referrers, popular paths)
# for a rolling 14 days, and serves nothing older through any API. The only way
# to have a year of it is to have been writing it down all along. This workflow
# is that: once a day it snapshots the traffic API for
# chouhanindustries/copperhead, appends the new rows to a long-lived time series,
# and commits the result to this repo's `github-repo-stats` branch.
#
# The data lands as CSV under <owner>/<repo>/ghrs-data/ on that branch, which is
# what src/repo-stats.ts reads at build time to render /stats/. The action also
# writes a rendered report (latest-report/report.html and .pdf) — GitHub previews
# the PDF inline, so the branch is browsable on its own if the site is down.
#
# The data branch is orphaned from main and is created by the action on its first
# run. Nothing here touches main, so this never triggers a Cloudflare build; the
# site picks the new numbers up on the next scheduled rebuild (see
# cloudflare-refresh.yml, every 6 hours).
#
# Requires repo secret GHRS_GITHUB_API_TOKEN. The default GITHUB_TOKEN cannot do
# this job at all: it is scoped to the repo the workflow runs in (copperhead-site)
# and the traffic being read belongs to a different one (copperhead).
#
# Least privilege is a fine-grained PAT covering both repos:
#   chouhanindustries/copperhead       Administration: read   (traffic endpoints)
#   chouhanindustries/copperhead-site  Contents: read + write (push the data branch)
# Administration:read is a read permission, so the measured repo does not need to
# grant push. A classic PAT with `repo` scope also works and is what upstream
# documents, but `repo` is far broader than anything here needs.
name: Repo stats

on:
  # Manual "snapshot now", useful right after adding the token.
  workflow_dispatch:

  # Daily, late UTC. The action is idempotent per day: a second run on the same
  # day refreshes that day's row rather than double-counting it, so a manual run
  # alongside the cron is safe.
  schedule:
    - cron: "20 23 * * *"

jobs:
  repo-stats:
    name: Snapshot copperhead traffic
    runs-on: ubuntu-latest
    steps:
      # Pinned to a commit SHA, not the v1.4.2 tag it belongs to. This is a
      # Docker action, so every run builds a Dockerfile from whatever the ref
      # resolves to, and it runs with a token that can read traffic for the
      # product repo and push branches here. A tag is mutable by whoever owns
      # the upstream repo; a SHA is not. (306db38 is v1.4.2.)
      - name: Collect and analyse
        uses: jgehrcke/github-repo-stats@306db38ad131cab2aa5f2cd3062bf6f8aa78c1aa
        with:
          # The tracked repo, not the data repo. Kept in sync by hand with
          # `repo` in src/config.ts, which is what the site reads the data under.
          repository: chouhanindustries/copperhead
          ghtoken: ${{ secrets.GHRS_GITHUB_API_TOKEN }}
          databranch: github-repo-stats
