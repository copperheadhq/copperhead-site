name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # blog-post skill rules 1 and 2: no em dashes, no serial comma, across the
      # blog and research collections. Runs before the build so a style failure
      # is not buried under a page render.
      - name: prose lint
        run: npm run lint:prose

      - run: npm run build

      # W-6: no em-dashes anywhere in rendered copy
      - name: check for em-dashes
        run: |
          if grep -q "—\|&mdash;\|&#8212;" dist/index.html; then
            echo "em-dash found in rendered HTML (W-6)"; exit 1
          fi

      # spec §9: no dead links to the repo or blog
      - name: link check
        run: |
          fail=0
          for url in $(grep -o 'href="https\?://[^"]*"' dist/index.html \
                       | sed 's/href="//;s/"$//' | sort -u); do
            code=$(curl -sL -o /dev/null -w "%{http_code}" --max-time 20 \
                   -A "Mozilla/5.0 (compatible; copperhead-linkcheck)" "$url")
            printf '%-64s %s\n' "$url" "$code"
            # 999 is LinkedIn's bot-block response, not a dead link. npmjs.com
            # and reddit.com are the same story with a different number: both
            # serve 403 to every non-browser client, so the hero's install-count
            # link and the footer's subreddit trip this while both are live.
            # Reddit answers 200 from a residential address and 403 from a
            # runner, which is the tell that it is the client being judged and
            # not the URL. Scoped to those hosts, because a 403 anywhere else is
            # still worth failing on. registry.npmjs.org and reddit's own
            # /r/<name>/about.json are the machine-readable endpoints if this
            # ever needs a real check.
            case "$code" in
              2*|3*|999) ;;
              403)
                case "$url" in
                  *//www.npmjs.com/*|*//www.reddit.com/*) ;;
                  *) fail=1 ;;
                esac
                ;;
              *) fail=1 ;;
            esac
          done
          exit $fail

      # Every published page (the sitemap, plus the 404) rendered at phone,
      # tablet and desktop widths against the built dist, failing on horizontal
      # scroll, elements bleeding past the viewport, or console errors. This is
      # the gate for the class of bug that shipped from-brief-to-gerbers with a
      # 220px rail column on phones: a media-query collapse that one page's
      # higher-specificity rule quietly outranked. Uses the runner's own Chrome.
      - name: layout audit
        run: |
          npx astro preview &
          for i in $(seq 1 30); do
            curl -sf http://localhost:4321/ > /dev/null && break
            sleep 1
          done
          npm run check:layout

      # W-10: total transfer excluding video stays under 100 KB
      - name: transfer budget
        run: |
          total=0
          for f in dist/index.html dist/fonts/*.woff2 dist/favicon.svg dist/favicon-32.png; do
            [ -f "$f" ] || continue
            total=$((total + $(gzip -c "$f" | wc -c)))
          done
          echo "gzipped transfer: $total bytes"
          [ "$total" -le 102400 ] || { echo "over 100 KB budget (W-10)"; exit 1; }
