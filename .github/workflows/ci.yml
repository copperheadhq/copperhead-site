name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # blog-post skill rules 1 and 2. The serial comma rule runs over the whole
      # tree: page copy in .astro, the docs at the root, llms.txt, the skills
      # and the comments and strings in the scripts. The em dash rule stays on
      # the two content collections, because a dash is load-bearing punctuation
      # in a code comment. Runs before the build so a style failure is not
      # buried under a page render.
      - name: prose lint
        run: npm run lint:prose

      - run: npm run build

      # W-6: no em-dashes anywhere in rendered copy
      - name: check for em-dashes
        run: |
          if grep -q "—\|&mdash;\|&#8212;" dist/index.html; then
            echo "em-dash found in rendered HTML (W-6)"; exit 1
          fi

      # spec §9: no dead links to the repo or blog
      - name: link check
        run: |
          fail=0
          for url in $(grep -o 'href="https\?://[^"]*"' dist/index.html \
                       | sed 's/href="//;s/"$//' | sort -u); do
            code=$(curl -sL -o /dev/null -w "%{http_code}" --max-time 20 \
                   -A "Mozilla/5.0 (compatible; copperhead-linkcheck)" "$url")
            printf '%-64s %s\n' "$url" "$code"
            # 999 is LinkedIn's bot-block response, not a dead link. npmjs.com,
            # reddit.com and x.com are the same story with a different number:
            # all three serve 403 to every non-browser client, so the hero's
            # install-count link and the footer's subreddit and X links trip
            # this while all three are live. Reddit and X answer 200 from a
            # residential address and 403 from a runner, which is the tell that
            # it is the client being judged and not the URL. X started doing it
            # on 2026-09-07 after passing on 2026-09-02, with no change to the
            # link. Scoped to those hosts, because a 403 anywhere else is still
            # worth failing on. registry.npmjs.org and reddit's own
            # /r/<name>/about.json are the machine-readable endpoints if this
            # ever needs a real check. instagram.com joined the list on
            # 2026-10-07 with a 429 rather than a 403, after passing on
            # 2026-09-08 with no change to the link: 200 from a residential
            # address, 429 from a runner, twice in a row.
            case "$code" in
              2*|3*|999) ;;
              403)
                case "$url" in
                  *//www.npmjs.com/*|*//www.reddit.com/*|*//x.com/*) ;;
                  *) fail=1 ;;
                esac
                ;;
              429)
                case "$url" in
                  *//www.instagram.com/*) ;;
                  *) fail=1 ;;
                esac
                ;;
              *) fail=1 ;;
            esac
          done
          exit $fail

      # Every published page (the sitemap, plus the 404) rendered against the
      # built dist at seven widths spanning the stylesheet's breakpoint bands,
      # failing on horizontal scroll, viewport bleed, console errors or a
      # wrong HTTP status. This is the gate for the class of bug that shipped
      # from-brief-to-gerbers with a 220px rail column on phones: a
      # media-query collapse that one page's higher-specificity rule quietly
      # outranked. One theme only — every audited metric is geometry, and the
      # theme CSS swaps colours and equal-size image pairs, never boxes. Off-
      # origin requests are blocked inside the audit, so these ~100 page loads
      # never reach the production analytics. Uses the runner's own Chrome;
      # curl --retry fails this step outright if preview never comes up.
      - name: layout audit
        run: |
          npx astro preview &
          curl -sf --retry 30 --retry-connrefused --retry-delay 1 -o /dev/null http://localhost:4321/
          npm run check:layout

      # W-10: total transfer excluding video stays under 100 KB
      - name: transfer budget
        run: |
          total=0
          for f in dist/index.html dist/fonts/*.woff2 dist/favicon.svg dist/favicon-32.png; do
            [ -f "$f" ] || continue
            total=$((total + $(gzip -c "$f" | wc -c)))
          done
          echo "gzipped transfer: $total bytes"
          [ "$total" -le 102400 ] || { echo "over 100 KB budget (W-10)"; exit 1; }
